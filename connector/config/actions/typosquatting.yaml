schema: action/1
title: Typosquatting / Look-alike Domains
name: typosquatting
description: 'Registered look-alikes of a brand. Provide exactly one of keyword or pattern (credits: 5 per page).'
inputs:
  type: object
  properties:
    keyword:
      title: keyword
      description: 'Brand label (letters, digits, hyphen; 3 to 63 chars; no dots).'
      type: string
    pattern:
      title: pattern
      description: 'Label pattern of 3 to 63 chars where * (up to three) is the only wildcard.'
      type: string
    pageToken:
      title: pageToken
      description: 'nextPageToken from the previous page; send with the original keyword or pattern.'
      type: string
    fetch_size:
      title: fetch_size
      description: 'Records per page (1 to 100).'
      type: integer
      default: 100
  required: []
output:
  type: object
  properties:
    status_code:
      title: Status Code
      type: number
    reason:
      title: Reason
      type: string
    success:
      title: Success
      type: boolean
    json_body:
      title: Json Body
      type: object
    error_message:
      title: Error Message
      type: string
meta:
  endpoint: /v3.0/domain/typos
  method: get
