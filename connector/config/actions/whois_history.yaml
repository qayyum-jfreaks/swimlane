schema: action/1
title: Historical WHOIS Lookup
name: whois_history
description: 'Every WHOIS snapshot recorded for a domain, newest first (credits: 2).'
inputs:
  type: object
  properties:
    domainName:
      title: domainName
      description: 'Domain name to look up historical WHOIS for.'
      type: string
    format:
      title: format
      description: 'Response format: json (default) or xml.'
      type: string
      enum:
        - json
        - xml
  required:
    - domainName
output:
  type: object
  properties:
    status_code:
      title: Status Code
      type: number
    reason:
      title: Reason
      type: string
    success:
      title: Success
      type: boolean
    json_body:
      title: Json Body
      type: object
    error_message:
      title: Error Message
      type: string
meta:
  endpoint: /v2.0/whois/history
  method: get
