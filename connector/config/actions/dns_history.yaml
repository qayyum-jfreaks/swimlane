schema: action/1
title: Historical DNS Lookup
name: dns_history
description: 'DNS snapshots recorded for a domain over time, 100 per page (credits: 2 per page).'
inputs:
  type: object
  properties:
    domainName:
      title: domainName
      description: 'Domain to look up historical DNS for.'
      type: string
    type:
      title: type
      description: 'Record types: all, or a comma-separated list of A, AAAA, MX, NS, TXT, SOA, SPF, CNAME.'
      type: string
      default: all
    page:
      title: page
      description: 'Page number, starting at 1.'
      type: integer
    format:
      title: format
      description: 'Response format: json (default) or xml.'
      type: string
      enum:
        - json
        - xml
  required:
    - domainName
    - type
output:
  type: object
  properties:
    status_code:
      title: Status Code
      type: number
    reason:
      title: Reason
      type: string
    success:
      title: Success
      type: boolean
    json_body:
      title: Json Body
      type: object
    error_message:
      title: Error Message
      type: string
meta:
  endpoint: /v2.0/dns/historical
  method: get
